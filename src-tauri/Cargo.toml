[package]
name = "gif_p"
version = "2.1.0"
description = "GIF_P portable GIF compressor"
authors = ["acekanon"]
edition = "2021"

[lib]
name = "gif_p_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
thiserror = "2"
